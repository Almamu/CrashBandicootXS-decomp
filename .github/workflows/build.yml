on:
  push:
    branches: [ main ]
  pull_request:
  # Only used by the fork-rom-check job below. `pull_request_target` runs this
  # workflow file as it is on main, so a PR can change the code that gets
  # built but not the job definition itself.
  pull_request_target:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-24.04
    # GitHub gives no repository secrets to pull_request runs from forks, so
    # those can't fetch the ROM. They compile every C file and generate the
    # objdiff report instead of linking and checksumming the ROM.
    name: "${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'Crash Bandicoot XS European' || 'Crash Bandicoot XS European (fork PR: compile and report only, no ROM check)' }}"
    env:
      HAS_ROM: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install build-essential binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev zlib1g-dev python3-pil

    - name: Checkout agbcc
      uses: actions/checkout@v5
      with:
        path: agbcc
        repository: SAT-R/agbcc

    - name: Install agbcc
      working-directory: agbcc
      run: ./build.sh && ./install.sh ../

    - name: Fetch baserom
      if: env.HAS_ROM == 'true'
      run: curl -fsS -o baserom.gba -u '${{ secrets.BASEROM_USERNAME }}:${{ secrets.BASEROM_PASSWORD }}' ${{ secrets.BASEROM_URL }}

    # `make compare` links the ROM and runs `sha1sum -c checksum.sha1`, which
    # fails the step on any byte mismatch.
    - name: Build and compare
      if: env.HAS_ROM == 'true'
      run: make compare

    # Progress report for decomp.dev (see docs/decomp_dev.md) - doesn't need
    # baserom.gba at all, since expected/code_3.s (checked into the repo) is
    # the ground truth it diffs against, not the ROM directly.
    - name: Build progress report objects
      run: |
        rm -f crashbandicootxs.gba crashbandicootxs.elf crashbandicootxs.map
        rm -rf build
        make NON_MATCHING=1 report

    - name: Install objdiff-cli
      run: |
        curl -sL -o objdiff-cli https://github.com/encounter/objdiff/releases/download/v3.8.1/objdiff-cli-linux-x86_64
        chmod +x objdiff-cli

    - name: Generate progress report
      run: ./objdiff-cli report generate -o report.json

    - name: Upload progress report artifact
      uses: actions/upload-artifact@v7
      with:
        name: europe_report
        path: report.json

  # The real ROM check for fork PRs. `pull_request` runs from forks get no
  # secrets, so they only compile and report (see the build job); this job
  # builds the fork's code *with* the baserom secrets, so it waits in the
  # `fork-pr-rom` environment until a maintainer approves the run. Before
  # approving, review the PR's changes to the Makefile, tools/, and any other
  # script the build runs - that code executes with access to the ROM.
  fork-rom-check:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    name: Crash Bandicoot XS European (fork PR ROM check, needs approval)
    environment: fork-pr-rom
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false

    # checksum.sha1 comes from the PR too, so keep main's copy aside and
    # compare against that - a PR editing the checksum can't pass itself.
    - name: Take the checksum from main
      run: curl -fsS -o "$RUNNER_TEMP/checksum.sha1" "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.base.sha }}/checksum.sha1"

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install build-essential binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev zlib1g-dev python3-pil

    - name: Checkout agbcc
      uses: actions/checkout@v5
      with:
        path: agbcc
        repository: SAT-R/agbcc
        persist-credentials: false

    - name: Install agbcc
      working-directory: agbcc
      run: ./build.sh && ./install.sh ../

    - name: Fetch baserom
      run: curl -fsS -o baserom.gba -u '${{ secrets.BASEROM_USERNAME }}:${{ secrets.BASEROM_PASSWORD }}' ${{ secrets.BASEROM_URL }}

    - name: Build
      run: make crashbandicootxs.gba

    - name: Compare against main's checksum
      run: sha1sum -c "$RUNNER_TEMP/checksum.sha1"
