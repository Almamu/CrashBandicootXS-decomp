on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # GitHub gives no repository secrets to pull_request runs from forks, so
    # those can't fetch the ROM. They compile every C file and generate the
    # objdiff report instead of linking and checksumming the ROM.
    name: "${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'Crash Bandicoot XS European' || 'Crash Bandicoot XS European (fork PR: compile and report only, no ROM check)' }}"
    env:
      HAS_ROM: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
    - uses: actions/checkout@v5

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install build-essential binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev zlib1g-dev python3-pil

    # The matching workarounds are spelled with include/match.h's macros
    # (docs/matching_techniques.md). This fails if one is written out by
    # hand outside the documented exceptions, or if a macro stops
    # expanding to the exact tokens it stands for.
    - name: Check matching idioms
      run: |
        python3 tools/match_idioms.py --check
        python3 tools/match_idioms.py --check-macros

    # The C style (.clang-format, CONTRIBUTING.md "Code style"), checked on
    # the paths formatted so far (FORMATTED in tools/format.py). The
    # clang-format version is pinned: other versions format differently.
    - name: Check formatting
      run: |
        pipx install clang-format==21.1.8
        python3 tools/format.py --check

    - name: Checkout agbcc
      uses: actions/checkout@v5
      with:
        path: agbcc
        repository: SAT-R/agbcc

    - name: Install agbcc
      working-directory: agbcc
      run: ./build.sh && ./install.sh ../

    - name: Fetch baserom
      if: env.HAS_ROM == 'true'
      run: curl -fsS -o baserom.gba -u '${{ secrets.BASEROM_USERNAME }}:${{ secrets.BASEROM_PASSWORD }}' ${{ secrets.BASEROM_URL }}

    # `make compare` links the ROM and runs `sha1sum -c checksum.sha1`, which
    # fails the step on any byte mismatch.
    - name: Build and compare
      if: env.HAS_ROM == 'true'
      run: make compare

    # Progress report for decomp.dev (see docs/decomp_dev.md). Code needs no
    # baserom.gba, since expected/code_3.s (checked into the repo) is the
    # ground truth it diffs against. The data units take their target bytes
    # from baserom.gba when it's there, and fall back to sizes only when not.
    - name: Build progress report objects
      run: |
        rm -f crashbandicootxs.gba crashbandicootxs.elf crashbandicootxs.map
        rm -rf build
        make NON_MATCHING=1 report

    - name: Install objdiff-cli
      run: |
        curl -sL -o objdiff-cli https://github.com/encounter/objdiff/releases/download/v3.8.1/objdiff-cli-linux-x86_64
        chmod +x objdiff-cli

    - name: Generate progress report
      run: ./objdiff-cli report generate -o report.json

    - name: Upload progress report artifact
      uses: actions/upload-artifact@v7
      with:
        name: europe_report
        path: report.json
