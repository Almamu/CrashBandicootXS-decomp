# The desktop editor (#1167, docs/editors.md "The desktop app"): apps/desktop,
# Tauri v2 around apps/editor's build, built on Linux, Windows and macOS.
# The bundles are this run's artifacts: unsigned, nothing is released.
name: Desktop app

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: the oldest glibc Tauri's Linux bundles support, so the
          # AppImage and the .deb run on more systems
          - os: ubuntu-22.04
            name: Linux
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    name: Desktop app (${{ matrix.name }})
    steps:
    - uses: actions/checkout@v5

    # Tauri's Linux libraries (WebKitGTK 4.1, libsoup 3, ...), xvfb for the
    # window's test
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y --no-install-recommends build-essential file libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev libssl-dev libayatana-appindicator3-dev libxdo-dev xvfb

    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: pnpm

    # the backend the app starts: the checkout's tools/editor_server.py
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: apps/desktop/src-tauri -> target

    - name: Install the workspace
      run: pnpm install --frozen-lockfile

    # `tauri build`: the web editor's build (beforeBuildCommand), the app, its bundles
    - name: Build the desktop app
      run: pnpm --filter @crash/desktop build

    # The binary starts the checkout's backend and asks its /api/health,
    # with no window: on every platform
    - name: Start the app's backend (smoke test)
      shell: bash
      run: |
        exe=apps/desktop/src-tauri/target/release/crash-editor
        [ -f "$exe.exe" ] && exe="$exe.exe"
        "$exe" --smoke --checkout "$GITHUB_WORKSPACE" --python python

    # Linux: the app itself, in a virtual display: its page loads, finds its
    # backend and lists XS's files
    - name: Open the app's window (Linux)
      if: runner.os == 'Linux'
      run: |
        export XDG_CONFIG_HOME=$RUNNER_TEMP/xdg CRASH_EDITOR_VERBOSE=1 CRASH_EDITOR_PYTHON=python
        timeout 40 xvfb-run -a apps/desktop/src-tauri/target/release/crash-editor --checkout "$GITHUB_WORKSPACE" > gui.log 2>&1 || true
        cat gui.log
        grep -q '"GET /api/projects/xs/files HTTP/1.1" 200' gui.log

    - name: Upload the bundles
      uses: actions/upload-artifact@v4
      with:
        name: crash-editor-${{ matrix.name }}
        path: |
          apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
          apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          apps/desktop/src-tauri/target/release/bundle/macos/
        if-no-files-found: error
