# The real ROM check for fork PRs, split out of build.yml so that workflow's
# jobs are never skipped (GitHub doesn't evaluate a skipped job's name, which
# left a raw ${{ }} expression in the PR's check list).
#
# `pull_request_target` runs this file as it is on main, so a PR can change
# the code that gets built but not this job's definition.
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  # The real ROM check for fork PRs. `pull_request` runs from forks get no
  # secrets, so they only compile and report (see the build job); this job
  # builds the fork's code *with* the baserom secrets, so it waits in the
  # `fork-pr-rom` environment until a maintainer approves the run. Before
  # approving, review the PR's changes to the Makefile, tools/, and any other
  # script the build runs - that code executes with access to the ROM.
  fork-rom-check:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    name: Crash Bandicoot XS European (fork PR ROM check, needs approval)
    environment: fork-pr-rom
    env:
      # The N-Tranced ROM check runs once its ROM's secret is set up
      # (BASEROM_N2_URL, docs/n_tranced.md).
      HAS_N2_ROM: ${{ secrets.BASEROM_N2_URL != '' }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false

    # games/xs/checksum.sha1 comes from the PR too, so keep main's copy
    # aside and compare against that - a PR editing the checksum can't pass
    # itself. A PR based on a main from before the checksums moved to
    # games/<game>/ has it at the root.
    - name: Take the checksum from main
      run: |
        base="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.base.sha }}"
        curl -fsS -o "$RUNNER_TEMP/checksum.sha1" "$base/games/xs/checksum.sha1" || curl -fsS -o "$RUNNER_TEMP/checksum.sha1" "$base/checksum.sha1"

    - name: Take the N-Tranced checksum from main
      if: env.HAS_N2_ROM == 'true'
      run: |
        mkdir -p "$RUNNER_TEMP/n2"
        curl -fsS -o "$RUNNER_TEMP/n2/checksum.sha1" "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.base.sha }}/games/n2/checksum.sha1"

    - name: Install dependencies
      run: sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y --no-install-recommends build-essential binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev zlib1g-dev python3-pil gettext

    - name: Checkout agbcc
      uses: actions/checkout@v5
      with:
        path: agbcc
        repository: SAT-R/agbcc
        persist-credentials: false

    - name: Install agbcc
      working-directory: agbcc
      run: ./build.sh && ./install.sh ../

    # agbcp/old_agbcp, the game code's C++ compilers (see build.yml).
    - name: Checkout agbcc (C++)
      uses: actions/checkout@v5
      with:
        path: agbcc-cp
        repository: notyourav/agbcc
        ref: 1caa6becde5e4676b59c31c74d68f45ced79557c
        persist-credentials: false

    - name: Build agbcp, old_agbcp and agbcp_arm_patched
      run: tools/build_agbccpp.sh agbcc-cp .

    - name: Fetch baserom
      run: curl -fsS -o baserom.gba -u '${{ secrets.BASEROM_USERNAME }}:${{ secrets.BASEROM_PASSWORD }}' ${{ secrets.BASEROM_URL }}

    - name: Build
      run: make crashbandicootxs.gba

    - name: Compare against main's checksum
      run: sha1sum -c "$RUNNER_TEMP/checksum.sha1"

    - name: Fetch the N-Tranced baserom
      if: env.HAS_N2_ROM == 'true'
      run: curl -fsS -o baserom_n2.gba -u '${{ secrets.BASEROM_USERNAME }}:${{ secrets.BASEROM_PASSWORD }}' ${{ secrets.BASEROM_N2_URL }}

    - name: Build N-Tranced
      if: env.HAS_N2_ROM == 'true'
      run: make GAME=n2 ntranced.gba

    - name: Compare N-Tranced against main's checksum
      if: env.HAS_N2_ROM == 'true'
      run: sha1sum -c "$RUNNER_TEMP/n2/checksum.sha1"
