on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    name: Host build (platform/pc)
    steps:
    - uses: actions/checkout@v5

    # The host build needs no ARM toolchain, agbcc or baserom: the stock
    # compiler, and what the data generators need (libpng and zlib for
    # gbagfx and grit, PIL, gettext); SDL2 for the window (the tests run
    # headless, which needs no SDL).
    - name: Install dependencies
      run: sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y --no-install-recommends build-essential libpng-dev zlib1g-dev python3-pil gettext pkg-config libsdl2-dev

    # The game compiled and linked into a 64-bit host executable on the pc
    # platform (#1093, docs/platforms.md), with its SDL2 window.
    - name: Build for the host
      run: |
        g++ --version
        make -j"$(nproc)" PLATFORM=pc HOST_SDL=1

    # Phase 2: the executable boots headless and plays
    # platform/pc/tests/boot.keys (the logos, the menus, the intro and
    # Jungle Jam, played on) for 6000 frames without crashing, and its palette RAM,
    # VRAM and OAM at each checkpoint are mGBA's (tests/boot_mgba.json,
    # tools/boottest.py run on the ROM with the same key file).
    - name: Boot headless
      run: |
        python3 tools/boottest.py host build/pc/crashbandicootxs_pc --keys platform/pc/tests/boot.keys \
          --frames 6000 --timeout 300 --screens host_screens --out host_boot.json
        python3 tools/boottest.py compare platform/pc/tests/boot_mgba.json host_boot.json

    # Phase 3: the PPU's picture (platform/pc/src/ppu.c) is mGBA's, pixel
    # for pixel: every frame of the boot, every 4th of the intro cutscene
    # (tests/*_mgba_screens.json: the hashes of mGBA 0.10.5's pictures,
    # tools/boottest.py `screens` on the ROM with the same key files), and
    # the reference pictures in tests/screens/ (mGBA's too).
    - name: Check the picture
      run: |
        python3 tools/boottest.py host build/pc/crashbandicootxs_pc --keys platform/pc/tests/boot.keys \
          --frames 6000 --every 1 --timeout 300 --out host_boot_screens.json
        python3 tools/boottest.py compare platform/pc/tests/boot_mgba_screens.json host_boot_screens.json
        python3 tools/boottest.py host build/pc/crashbandicootxs_pc --keys platform/pc/tests/intro.keys \
          --frames 2400 --every 4 --timeout 300 --out host_intro_screens.json
        python3 tools/boottest.py compare platform/pc/tests/intro_mgba_screens.json host_intro_screens.json
        python3 tools/boottest.py diff-screens platform/pc/tests/screens host_screens

    # Phase 7: the link, stubbed as a GBA with no cable (platform/pc/src/sio.c).
    # tests/link.keys opens the save menu's "load link game", which waits
    # for a console that isn't there until B aborts it, and leaves the menu;
    # every frame's picture is mGBA's with no link (tests/link_mgba_screens.json).
    - name: Check the link
      run: |
        python3 tools/boottest.py host build/pc/crashbandicootxs_pc --keys platform/pc/tests/link.keys \
          --frames 1000 --every 1 --timeout 300 --out host_link_screens.json
        python3 tools/boottest.py compare platform/pc/tests/link_mgba_screens.json host_link_screens.json

    # Phase 6: GAX2 on the host mixes what the GBA's mixes, byte for byte:
    # tests/boot_gax.trace is mGBA 0.10.5's trace of the game's GAX2 calls
    # and blocks in the boot (tools/boottest.py `gax-trace`), which
    # --gax-trace replays through the host's GAX2, comparing each of its
    # 1634 blocks. Then the game on the host makes the same GAX2 calls as
    # on mGBA (--gax-log, `gax-calls`: the songs, sound effects, volumes
    # and fades, in order, not their timing), and writes its sound.
    - name: Check the sound
      run: |
        build/pc/crashbandicootxs_pc --gax-trace platform/pc/tests/boot_gax.trace
        build/pc/crashbandicootxs_pc --headless --quiet --keys platform/pc/tests/boot.keys --frames 960 \
          --gax-log host_boot_gax.trace --wav host_boot.wav
        python3 tools/boottest.py gax-calls platform/pc/tests/boot_gax.trace host_boot_gax.trace

    # Phase 4: the window, with SDL's dummy video and audio drivers: paced
    # to the GBA's 59.73 frames a second, 300 game frames (about 400
    # VBlanks) take some 7 s.
    - name: Run in a window
      run: |
        time SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy timeout 60 build/pc/crashbandicootxs_pc \
          --keys platform/pc/tests/boot.keys --frames 300 --quiet

    # Without SDL the executable is headless only.
    - name: Build without SDL
      run: |
        make -j"$(nproc)" PLATFORM=pc HOST_SDL=0
        build/pc/crashbandicootxs_pc --keys platform/pc/tests/boot.keys --frames 60 --quiet

    - name: Upload the pictures and the sound
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: host_screens
        path: |
          host_screens
          host_boot.wav
          host_boot_gax.trace

    # The linker-placed globals fit in the room the host's placement gives
    # them (twice their GBA slot).
    - name: Check the placed globals
      run: |
        python3 platform/pc/tools/layout_check.py --link build/pc/crashbandicootxs/host_link.ld \
          --iwram games/xs/sym_iwram.txt --ewram games/xs/sym_ewram.txt build/pc/crashbandicootxs_pc
